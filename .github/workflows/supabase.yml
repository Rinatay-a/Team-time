name: Развёртывание Supabase

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Только функция или миграции БД и функция'
        type: choice
        default: function-only
        options:
          - function-only
          - migrations-and-function

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Проверить настройки
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Добавьте Secret SUPABASE_ACCESS_TOKEN'; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo 'Добавьте Variable SUPABASE_PROJECT_REF'; exit 1; }
      - name: Применить миграции
        if: inputs.operation == 'migrations-and-function'
        shell: bash
        run: |
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Добавьте Secret SUPABASE_DB_PASSWORD'; exit 1; }
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --yes
      - name: Опубликовать team-time-api
        run: supabase functions deploy team-time-api --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
